# Local dev daemons, supervised by pitchfork (tools come from mise, see .mise.toml).
#
#   pitchfork start dev     # same stack as `make dev`, in the background
#   pitchfork logs dev -f
#   pitchfork stop dev
#
# The dev stack stays on docker compose: Vite serves only the SPA/HMR and Caddy
# terminates TLS and routes /site, /api, /collect to the backend (see Caddyfile),
# so the services are not meant to be split out onto the host one by one.

[daemons.dev]
run = "docker compose up"
# Caddy publishes 443 once the stack is routing.
ready_port = { port = 443, timeout = "120s" }
mise = true
# `docker compose up` stops its containers gracefully on SIGINT.
stop_signal = { signal = "SIGINT", timeout = "60s" }
