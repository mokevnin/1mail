packages:
  - 'packages/*'
# Install platform-native binaries (biome, tsgo, esbuild…) for every target: the
# glibc dev container, the darwin host (so host LSP/CLI works), and both CPUs / CI.
supportedArchitectures:
  os:
    - linux
    - darwin
  cpu:
    - x64
    - arm64
  libc:
    - glibc
    - musl
allowBuilds:
  '@swc/core': true
  better-sqlite3: true
  esbuild: true
minimumReleaseAgeExclude:
  - '@typescript/native-preview-darwin-arm64@7.0.0-dev.20260620.1'
  - '@typescript/native-preview-darwin-x64@7.0.0-dev.20260620.1'
