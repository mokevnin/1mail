# Anchor users. Passwords are stated as plaintext and hashed at load time
# (argonHash template call); the plaintext becomes a catalog constant (fixtures.<Name>Password).
# OwnerJohn owns Acme, OwnerJane owns Globex, MemberMary is a member of Acme,
# OutsiderOscar has no membership.
- id: 1 # fixture: OwnerJohn
  name: John
  email: info@1mail.com
  password_hash: '{{argonHash "password"}}'
  created_at: '2026-01-01 00:00:00'
  updated_at: '2026-01-01 00:00:00'
- id: 2 # fixture: OwnerJane
  name: Jane
  email: jane@globex.test
  password_hash: '{{argonHash "jane-test-password"}}'
  created_at: '2026-01-01 00:00:00'
  updated_at: '2026-01-01 00:00:00'
- id: 3 # fixture: MemberMary
  name: Mary
  email: mary@acme.test
  password_hash: '{{argonHash "mary-test-password"}}'
  created_at: '2026-01-01 00:00:00'
  updated_at: '2026-01-01 00:00:00'
- id: 4 # fixture: OutsiderOscar
  name: Oscar
  email: oscar@nowhere.test
  password_hash: '{{argonHash "oscar-test-password"}}'
  created_at: '2026-01-01 00:00:00'
  updated_at: '2026-01-01 00:00:00'
# Sam has an active TOTP Second factor (ADR 0020): the secret is sealed at load time
# and lifted into fixtures.SecondFactorSamTotpSecret; his Recovery codes are in
# recovery_codes.yml. He is a member of Globex (Acme's member list stays exact).
- id: 5 # fixture: SecondFactorSam
  name: Sam
  email: sam@globex.test
  password_hash: '{{argonHash "sam-test-password"}}'
  second_factor_secret_encrypted: '{{encrypt "JBSWY3DPEHPK3PXP"}}'
  second_factor_confirmed_at: '2026-01-01 00:00:00'
  created_at: '2026-01-01 00:00:00'
  updated_at: '2026-01-01 00:00:00'
