# Workspace acme (id 1). secret_encrypted is sealed at load time via the encrypt
# template func (per-env valid). event_types is a JSON array; empty/absent = all events.
- id: 100 # fixture: WebhookCodebasics
  url: https://codebasics.dev/webhooks/1mail
  secret_encrypted: '{{ encrypt "whsec_codebasics_primary" }}'
  event_types: '["contact.created","email.opened","email.clicked"]'
  enabled: true
  workspace_id: 1
  created_at: '{{daysAgo 70}}'
  updated_at: '{{daysAgo 70}}'
- id: 101
  url: https://hooks.codebasics.dev/disabled
  secret_encrypted: '{{ encrypt "whsec_codebasics_disabled" }}'
  enabled: false
  workspace_id: 1
  created_at: '{{daysAgo 50}}'
  updated_at: '{{daysAgo 50}}'

# --- Globex (workspace 2) foreign row — DO NOT change ---
- id: 900 # fixture: WebhookGlobex
  url: https://globex.example/hook
  secret_encrypted: '{{ encrypt "whsec_globex" }}'
  enabled: true
  workspace_id: 2
  created_at: '2026-01-01 00:00:00'
  updated_at: '2026-01-01 00:00:00'
