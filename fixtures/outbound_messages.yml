# A pending claim whose attempt died long ago (claimed_at is a day old): a retry takes it
# over. Tests that need a LIVE claim set claimed_at to now (txdb rolls it back).
- id: 106
  kind: transactional
  idempotency_key: 'transactional:fixture-stale-claim'
  channel: email
  destination: lease.demo@codebasics.dev
  template_id: 1
  status: pending
  claimed_at: '{{daysAgo 1}}'
  workspace_id: 1
  created_at: '{{daysAgo 1}}'
  updated_at: '{{daysAgo 1}}'

# Usage of the Integrations over the trailing 24 hours (ADR 0023): two sends inside the
# window and one outside it through the default Integration (1), one inside through the
# disabled SES one (2). integration_id is a plain id snapshot, not an FK.
