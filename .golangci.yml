version: '2'
linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - depguard
    - errorlint
    - noctx
    - rowserrcheck
    - sqlclosecheck
    - usetesting
  settings:
    depguard:
      rules:
        main:
          list-mode: lax
          deny:
            - pkg: github.com/samber/mo
              desc: monads fight Go idioms; use stdlib or samber/lo
