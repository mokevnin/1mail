# Dev stack — replaces overmind/Procfile.
#
# Dependencies live on the HOST and are bind-mounted in, so editor LSPs
# (gopls / TS language server) resolve imports. Install them via the container:
#   docker compose run --rm frontend pnpm install
#
# Entry point: https://1mail.localhost (TLS terminated by Caddy).
services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data # local CA + certs persist across restarts
      - caddy-config:/config
    depends_on:
      - frontend
      - backend

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend.dev
    working_dir: /app
    volumes:
      - .:/app # repo (incl. node_modules) lives on the host
      - pnpm-store:/app/.pnpm-store # same FS as node_modules → pnpm hardlinks work
    environment:
      PNPM_STORE_DIR: /app/.pnpm-store
    ports:
      - "5173:5173" # optional direct access; normal entry is via Caddy

  # Go server. Like the frontend, the image ships only the toolchain (+ air for
  # hot reload); sources are bind-mounted from the host and air rebuilds/restarts
  # on change. DB schema is managed on the host (atlas, `make db-migrate`); this
  # service only runs the server, so don't set AUTO_MIGRATE here.
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend.dev
    working_dir: /app
    environment:
      APP_ENV: development
      CGO_ENABLED: "0" # alpine has no gcc; the server is pure Go (pgx stdlib)
      PORT: "3300"
      DATABASE_URL: postgres://postgres:postgres@db:5432/1mail_development?sslmode=disable
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      APP_URL: https://1mail.localhost
    volumes:
      - .:/app # repo (sources) lives on the host
      - go-mod:/go/pkg/mod # module + air cache
      - go-build:/root/.cache/go-build # compile cache
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: 1mail_development
    ports:
      - "5432:5432" # host-side Go dev / atlas connect here
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI

volumes:
  caddy-data:
  caddy-config:
  pnpm-store:
  db-data:
  go-mod: # go module cache (persists across restarts)
  go-build: # go compile cache (fast rebuilds)
