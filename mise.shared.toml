# Profile loaded by `MISE_ENV=shared` (export it from your shell profile; see AGENTS.md,
# "Dev environment"). It REPLACES the per-checkout `db` daemon of .mise.toml with a database
# on one Postgres shared by every checkout and worktree: the machine's global mise config
# declares the server,
#
#   [daemon_providers.onemail-pg]
#   preset = "postgres"
#   version = "18"
#
# and each checkout gets its own database on it (a name derived from the checkout's path).
# One postmaster for all worktrees keeps macOS's 32 SysV shared-memory segments free.
# Without MISE_ENV (CI, contributors) the per-checkout daemon of .mise.toml applies.
[daemons.db]
provider = "onemail-pg"
