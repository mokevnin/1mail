name: Dependency review

# Runs on pull requests only (in practice: Dependabot PRs, since maintainers commit
# straight to main). Blocks known-vulnerable or license-incompatible dependencies.
on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Review dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          allow-licenses: >-
            MIT, MIT-0, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD, Zlib, Unlicense,
            CC0-1.0, CC-BY-4.0, MPL-2.0, BlueOak-1.0.0, Python-2.0, AGPL-3.0-only,
            AGPL-3.0-or-later, LGPL-3.0-only, LGPL-3.0-or-later
