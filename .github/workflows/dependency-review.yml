name: Dependency review

# Runs only on release-please pull requests.
on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    if: startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          allow-licenses: >-
            MIT, MIT-0, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD, Zlib, Unlicense,
            CC0-1.0, CC-BY-4.0, MPL-2.0, BlueOak-1.0.0, Python-2.0, AGPL-3.0-only,
            AGPL-3.0-or-later, LGPL-3.0-only, LGPL-3.0-or-later
