# Project tasks, included from .mise.toml (`[task_config] includes`).
#   mise tasks          list them
#   mise run <task>     run one (tasks that need Postgres start the `db` daemon first)
# Tasks run natively with the tools pinned in .mise.toml; the dev stack itself is the
# [daemons] table there.

# --- setup & dev stack ----------------------------------------------------------

[install]
description = "Install frontend and Go dependencies"
run = ["pnpm install", "go mod download"]

[setup]
description = "Install deps, start Postgres, create dev/test/atlas DBs, migrate and seed, drop the databases of deleted worktrees"
depends = ["install", "db:seed", "db:create-test"]
run = [{ task = "worktrees:gc --apply" }]

[dev]
description = "Start the whole dev stack (https://1mail.localhost)"
run = "mise daemons start caddy"

["dev:down"]
description = "Stop the dev stack"
run = "mise daemons stop"

# --- database --------------------------------------------------------------------

["db:create"]
description = "Create the dev database"
daemons = ["db"]
run = "go run ./cmd/db create"

["db:create-test"]
description = "Create the test database"
daemons = ["db"]
env = { APP_ENV = "test", DATABASE_URL = "{{env.TEST_DB_URL}}" }
run = "go run ./cmd/db create"

["db:create-atlas"]
description = "Create the scratch database atlas uses to compute migration diffs (atlas.hcl `dev`)"
daemons = ["db"]
env = { DATABASE_URL = "{{env.ATLAS_DEV_URL}}" }
run = "go run ./cmd/db create"

["db:drop"]
description = "Drop the dev database"
daemons = ["db"]
run = "go run ./cmd/db drop"

["db:drop-test"]
description = "Drop the test database"
daemons = ["db"]
env = { APP_ENV = "test", DATABASE_URL = "{{env.TEST_DB_URL}}" }
run = "go run ./cmd/db drop"

["db:migrate-atlas"]
description = "Apply Atlas migrations"
daemons = ["db"]
depends = ["db:create", "db:create-atlas"]
run = "atlas migrate apply --env local --allow-dirty"

["db:migrate-river"]
description = "Apply river's own schema (river_job, ...), out of band from Atlas"
daemons = ["db"]
depends = ["db:create"]
run = "go run ./cmd/db river-up"

["db:migrate"]
description = "Apply Atlas migrations, then river's schema"
daemons = ["db"]
depends = ["db:migrate-atlas"]
run = "go run ./cmd/db river-up"

["db:seed"]
description = "Load seed data into the dev database"
daemons = ["db"]
depends = ["db:migrate"]
run = "go run ./cmd/seed"

["db:reset"]
description = "Drop, recreate and migrate the dev database"
run = [{ task = "db:drop" }, { task = "db:migrate" }]

["db:reset-test"]
description = "Drop and recreate the test database"
run = [{ task = "db:drop-test" }, { task = "db:create-test" }]

["db:generate"]
description = "Generate an Atlas migration from the ent schema (ent's own diff engine; the community Atlas binary cannot read ent://)"
daemons = ["db"]
depends = ["db:create-atlas"]
usage = 'arg "<name>" help="migration name"'
run = 'go run ./cmd/db generate "${usage_name}"'

["gen:encryption-key"]
description = "Mint a fresh ENCRYPTION_KEY (base64 Tink keyset) to paste into your .env"
run = "go run ./cmd/server genkey"

# --- worktrees ----------------------------------------------------------------------

["worktrees:prune"]
description = "Remove clean worktrees whose branch is already in origin/main, then run worktrees:gc; dry run unless --apply"
usage = 'flag "--apply" help="actually remove, instead of listing"'
run = '''
git fetch -q origin main
main_wt=$(git worktree list --porcelain | sed -n '1s/^worktree //p')
git worktree list --porcelain | awk '/^worktree /{p=substr($0,10)} /^branch /{b=substr($0,8)} /^$/{if(p&&b)print p"\t"b; p="";b=""} END{if(p&&b)print p"\t"b}' |
while IFS=$'\t' read -r path ref; do
  [ "$path" = "$main_wt" ] && continue
  branch=${ref#refs/heads/}
  [ -n "$(git -C "$path" status --porcelain)" ] && { echo "keep    $path ($branch): uncommitted changes"; continue; }
  git merge-base --is-ancestor "$ref" origin/main || { echo "keep    $path ($branch): not in origin/main"; continue; }
  if [ -z "${usage_apply:-}" ]; then echo "would remove $path ($branch)"; continue; fi
  git worktree unlock "$path" 2>/dev/null || true
  git worktree remove "$path" && git branch -D "$branch" >/dev/null && echo "removed $path ($branch)"
done
# What the removed worktrees leave behind (daemons, databases) is worktrees:gc's to sweep.
mise run worktrees:gc ${usage_apply:+--apply}
'''

["worktrees:gc"]
description = "Sweep what deleted worktrees leave behind: databases on the shared Postgres (MISE_ENV=shared) that no live worktree owns, and daemon state (mise daemons prune); idempotent, dry run unless --apply"
usage = 'flag "--apply" help="actually drop and prune, instead of listing"'
quiet = true
run = '''
#!/usr/bin/env bash
set -euo pipefail
apply=${usage_apply:-}
status=0

# 1. Databases. Only a shared server (the db daemon is a consumer of the global `onemail-pg`
#    provider, mise.shared.toml) holds several checkouts' databases; a per-checkout daemon
#    lives and dies with its worktree's state (step 2).
if ! mise daemons ls --json | grep -q '"ownership": "consumer"'; then
  echo "db: this checkout runs its own Postgres (MISE_ENV is not shared): no shared server to sweep"
else
  mise daemons start db >/dev/null 2>&1
  keep=$(mktemp)
  trap 'rm -f "$keep"' EXIT
  refuse=""
  # A live worktree is a `git worktree list` entry whose directory exists. Its databases are
  # its PGDATABASE and the _test, _e2e and _atlas twins, read from the worktree's own mise
  # environment. Whatever cannot be read leaves the keep list incomplete: drop nothing then.
  worktrees=$(git worktree list --porcelain | awk '/^worktree /{p=substr($0,10); pr=0} /^prunable/{pr=1} /^$/{if(p) print p"\t"pr; p=""} END{if(p) print p"\t"pr}') || worktrees=""
  [ -n "$worktrees" ] || refuse="cannot enumerate git worktrees"
  while IFS=$'\t' read -r path prunable; do
    [ -n "$path" ] || continue
    if [ ! -d "$path" ]; then
      if [ "$prunable" = 1 ]; then echo "gone    $path (deleted worktree)"; continue; fi
      refuse="$refuse; $path is missing but git does not mark it prunable"; continue
    fi
    if ! out=$(mise -C "$path" env 2>/dev/null); then
      refuse="$refuse; cannot read the mise environment of $path (mise trust it?)"; continue
    fi
    db=$(printf '%s\n' "$out" | sed -n "s/^export PGDATABASE=//p" | tr -d "'")
    # Every checkout declares `db`: an empty name means its environment was not read properly.
    if [ -z "$db" ]; then refuse="$refuse; $path exports no PGDATABASE"; continue; fi
    # Postgres truncates identifiers at 63 bytes: a long name would make its twins collide.
    if [ $(($(printf '%s' "$db" | wc -c) + 6)) -gt 63 ]; then refuse="$refuse; $db is too long for its _test/_e2e/_atlas twins"; continue; fi
    printf '%s\n%s_test\n%s_e2e\n%s_atlas\n' "$db" "$db" "$db" "$db" >> "$keep"
    echo "live    $path -> $db"
  done <<< "$worktrees"

  if [ -n "$refuse" ]; then
    echo "db: refusing to drop anything: ${refuse#; }" >&2
    status=1
  else
    psql="psql -X -A -t -q -d postgres"
    for d in $($psql -c "select datname from pg_database where not datistemplate and datname <> 'postgres'"); do
      if grep -qxF "$d" "$keep"; then continue; fi
      case "$d" in *\"*) echo "keep    database $d (unusual name)"; continue ;; esac
      if [ -z "$apply" ]; then echo "would drop database $d"; continue; fi
      $psql -c "drop database \"$d\" with (force)" >/dev/null && echo "dropped database $d"
    done
  fi
fi

# 2. Daemon state of deleted worktrees and projects (stops their daemons, deletes state and data).
if [ -z "$apply" ]; then mise daemons prune --dry-run; else mise daemons prune --yes; fi
exit "$status"
'''

# --- tests -----------------------------------------------------------------------

[test]
description = "Go tests, shuffled (creates the test DB first); pass packages/flags after `--`"
daemons = ["db"]
depends = ["db:create-test"]
env = { APP_ENV = "test", DATABASE_URL = "{{env.TEST_DB_URL}}" }
usage = 'arg "[go_test_args]" var=#true default="./..." help="packages and flags for go test"'
run = 'eval "set -- $usage_go_test_args"; go test -p 1 -shuffle=on "$@"'

["test:e2e"]
description = "End-to-end suite (ADR 0024): rebuilds the dedicated e2e DB, starts its own Mailpit, boots the app in-process; pass `go test` flags after `--`; HOLD=true keeps the stack up after the run for inspection"
daemons = ["db"]
env = { APP_ENV = "e2e", DATABASE_URL = "{{env.E2E_DB_URL}}", METRICS_ADDR = "" }
usage = 'arg "[go_test_args]" var=#true default="./e2e/..." help="packages and flags for go test"'
run = [
  "go run ./cmd/db drop",
  "go run ./cmd/db create",
  "atlas migrate apply --env local --allow-dirty",
  "go run ./cmd/db river-up",
  '''eval "set -- $usage_go_test_args"; go test -tags e2e -count=1 -p 1 -shuffle=on "$@"''',
]

["test:watch"]
description = "Frontend tests in watch mode"
run = "pnpm exec vitest"

["test:frontend"]
description = "One-shot frontend run with v8 coverage and thresholds (Vitest Browser Mode, headless Chromium), used by CI; html report in coverage/"
run = "pnpm exec vitest run --coverage"

# --- dependency updates ----------------------------------------------------------

[update]
description = "Update npm, Go and skills dependencies"
depends = ["update:npm", "update:go", "update:skills"]

["update:npm"]
run = "pnpm exec ncu -u && pnpm update"

["update:go"]
run = "go get -u ./... && go mod tidy"

["update:skills"]
run = "npx skills@latest update -y"

# --- code generation (TypeSpec -> OpenAPI -> Go + TS) -----------------------------

["generate:typespec-external"]
run = "pnpm exec tsp compile typespec/external"

["generate:typespec-site"]
run = "pnpm exec tsp compile typespec/site"

["generate:typespec-collect"]
run = "pnpm exec tsp compile typespec/collect"

["generate:typespec"]
description = "TypeSpec -> OpenAPI"
depends = ["generate:typespec-external", "generate:typespec-site", "generate:typespec-collect"]

["generate:openapi"]
description = "OpenAPI -> TS clients (site client and collect types, one config)"
run = "pnpm exec openapi-ts -f openapi-ts.config.ts"

["generate:i18n-types"]
run = "pnpm run i18n:types"

["generate:backend"]
description = "OpenAPI/ent -> Go (ent, ogen, goverter)"
run = [
  "cd ent && go run -mod=mod entc.go",
  "go tool ogen --target gen/site --package siteapi --clean openapi/site.openapi.json",
  "go tool ogen --target gen/external --package externalapi --clean openapi/external.openapi.json",
  "go tool ogen --target gen/collect --package collectapi --clean openapi/collect.openapi.json",
  "go tool goverter gen ./internal/api/site/resources ./internal/api/external/resources",
]

["generate:mocks"]
description = "Go interfaces -> test mocks (moq, *_gen_test.go next to the tests that use them)"
run = [
  "go tool moq -out internal/jobs/mocks_gen_test.go -pkg jobs_test ./internal/outbound Senders",
  "go tool moq -out internal/messaging/mocks_gen_test.go -pkg messaging_test ./internal/messaging EmailSender",
  "go tool moq -out internal/events/mocks_gen_test.go -pkg events ./internal/events Enroller WebhookDispatcher",
  "go tool moq -out internal/events/mocks_ext_gen_test.go -pkg events_test ./internal/events Enroller WebhookDispatcher",
  "go tool moq -out cmd/server/mocks_gen_test.go -pkg main ./cmd/server workspaceOps",
]

["generate:fixtures"]
description = "fixtures/*.yml -> Go (fixture catalog constants for `# fixture: Name` rows)"
run = "go run ./cmd/fixturegen"

[generate]
description = "Full cycle: typespec -> openapi -> backend -> test mocks -> fixture catalog -> frontend -> i18n types -> format"
run = [
  { task = "generate:typespec" },
  { task = "generate:openapi" },
  { task = "generate:backend" },
  { task = "generate:mocks" },
  { task = "generate:fixtures" },
  { task = "fix" },
]

["generate:check"]
description = "Fail when committed generated output differs from what `generate` produces (CI gate, needs a clean tree)"
run = [
  { task = "generate" },
  '''test -z "$(git status --porcelain)" || { echo 'generated code is out of date; run `mise run generate` and commit:'; git status --short; git diff | head -80; exit 1; }''',
]

# --- checks ----------------------------------------------------------------------

[check]
description = "Every linter, type-check and security check"
depends = [
  "check:fe",
  "check:i18n",
  "check:be",
  "check:deps",
  "check:security",
  "check:ast",
  "check:typos",
  "check:adr",
  "check:env",
  "check:helm",
]

["check:fe"]
description = "tsc, oxlint, oxfmt --check, no custom CSS"
depends = ["check:css"]
run = ["pnpm exec tsc --noEmit", "pnpm exec oxlint", "pnpm exec oxfmt --check"]

["check:css"]
description = "The project has no custom CSS: no stylesheet may be tracked (library CSS comes from node_modules)"
run = '''
if git ls-files | grep -Ei '\.(css|scss|sass|less|pcss|styl)$'; then
  echo 'error: custom CSS is not allowed, style through Mantine'; exit 1
fi
'''

["check:adr"]
description = "ADR numbers are unique (parallel integration branches each pick the next free number)"
run = '''
nums=$(ls docs/adr | sed -n 's/^\([0-9][0-9]*\)-.*/\1/p')
dup=$(echo "$nums" | sort | uniq -d)
if [ -n "$dup" ]; then
  next=$(printf '%04d' $(( $(echo "$nums" | sort -n | tail -1 | sed 's/^0*//') + 1 )))
  echo "error: duplicate ADR numbers in docs/adr: $(echo $dup); renumber the newer file (next free: $next)"; exit 1
fi
'''

["check:env"]
description = "Every environment variable config/config.go reads is documented in docs/self-hosting.md (the one env table)"
run = '''
read_vars=$(mktemp); doc_vars=$(mktemp)
grep -oE '"[A-Z][A-Z0-9_]{3,}"' config/config.go | tr -d '"' | sort -u > "$read_vars"
grep -oE '`[A-Z][A-Z0-9_]{3,}`' docs/self-hosting.md | tr -d '`' | sort -u > "$doc_vars"
missing=$(comm -23 "$read_vars" "$doc_vars")
rm -f "$read_vars" "$doc_vars"
if [ -n "$missing" ]; then
  echo "error: add to the env table in docs/self-hosting.md: $(echo $missing)"; exit 1
fi
'''

["check:deps"]
description = "Unused files, exports and dependencies (knip.ts)"
run = "pnpm exec knip"

["check:i18n"]
description = "i18n key drift (read-only: --dry-run never writes, --ci exits non-zero on drift)"
run = [
  "pnpm exec i18next-cli extract --ci --dry-run",
  "pnpm exec i18next-cli types --ci",
  "pnpm exec i18next-cli lint",
]

["check:be"]
description = "golangci-lint, govulncheck and go.mod tidiness"
run = [
  "golangci-lint run --allow-serial-runners ./...",
  "go tool govulncheck ./...",
  "go mod tidy -diff",
]

["check:ast"]
description = "Project-specific syntax rules (sgconfig.yml, ast-grep/): tests, then scan"
run = ["ast-grep test", "ast-grep scan"]

["check:typos"]
description = "Spelling in code, docs and comments (_typos.toml)"
run = "typos"

["check:tracker-size"]
description = "Tracker (t.js) gzip size budget (package.json size-limit); builds it first"
run = ["pnpm build:tracker", "pnpm exec size-limit"]

["check:helm"]
description = "Helm chart: lint, schema-validated render (default and all-features), and refusal without existingSecret, runbook coverage of every alert"
run = '''
set -eu
chart=charts/1mail
helm lint "$chart" --set existingSecret=1mail-secrets
if helm template r "$chart" >/dev/null 2>&1; then
  echo 'error: chart rendered without existingSecret'; exit 1
fi
# ServiceMonitor is a CRD kind: kubeconform has no built-in schema for it.
kc='kubeconform -strict -summary -ignore-missing-schemas'
helm template r "$chart" --set existingSecret=1mail-secrets | $kc
helm template r "$chart" --set existingSecret=1mail-secrets \
  --set ingress.enabled=true --set ingress.tls.enabled=true --set ingress.tls.secretName=tls \
  --set metrics.enabled=true --set metrics.serviceMonitor.enabled=true \
  --set metrics.prometheusRule.enabled=true | $kc
# Every alert in the rules needs a runbook section named after it.
for alert in $(sed -n 's/^ *- alert: *//p' "$chart/files/alerts.yaml"); do
  grep -q "^## $alert\$" docs/operations/runbook.md || { echo "error: no runbook section for $alert"; exit 1; }
done
'''

["check:security"]
description = "Secrets and workflow linters"
run = ["gitleaks git --no-banner --redact", "jactionlint", "zizmor --no-progress .github"]

[fix]
description = "Auto-fix i18n keys, lint and formatting"
run = [{ task = "fix:i18n" }, { task = "fix:fe" }, { task = "fix:be" }]

["fix:i18n"]
description = "Extract i18n keys (runs first so oxfmt formats the fresh JSON)"
run = "pnpm exec i18next-cli extract --with-types"

["fix:fe"]
description = "oxlint --fix, tsp format, oxfmt"
# tsp format rewrites tspconfig.yaml quotes; oxfmt must run last to normalize them.
run = ["pnpm exec oxlint --fix", "pnpm exec tsp format typespec", "pnpm exec oxfmt"]

["fix:be"]
run = "go fmt ./..."

# --- build -----------------------------------------------------------------------

["build:tracker"]
description = "Build the standalone tracker (IIFE) and copy it into the Go embed tree"
run = ["pnpm build:tracker", "cp packages/analytics/dist/t.js internal/server/assets/t.js"]

["build:spa"]
description = "Build the SPA (Vite) into the Go embed tree (gitignored; release builds only)"
run = [
  "pnpm build",
  "rm -rf internal/server/assets/spa",
  "mkdir -p internal/server/assets/spa",
  "cp -R dist/. internal/server/assets/spa/",
]

[build]
description = "Self-contained release binary (tracker + SPA embedded); VERSION env overrides `dev`"
depends = ["build:tracker", "build:spa"]
run = '''
commit=$(git rev-parse --short HEAD 2>/dev/null || echo none)
date=$(date -u +%Y-%m-%dT%H:%M:%SZ)
go build -tags embed_spa -ldflags "-s -w -X main.version=${VERSION:-dev} -X main.commit=$commit -X main.date=$date" -o bin/1mail ./cmd/server
'''

[loc]
description = "Lines-of-code report (scc) over hand-written files only"
# The set of generated files is the source of truth in .gitattributes
# (linguist-generated=true), so only tracked files git marks as hand-written are fed to scc.
run = '''
git ls-files | git check-attr --stdin linguist-generated | awk -F': ' '$3!="true"{print $1}' | xargs scc
'''
