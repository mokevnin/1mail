apiVersion: v1
kind: Service
metadata:
  name: {{ include "sphericon.fullname" . }}
  labels:
    {{- include "sphericon.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "sphericon.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
{{- if and .Values.metrics.enabled .Values.metrics.serviceMonitor.enabled }}
---
# Cluster-internal Service for the metrics listener only; never routed by the Ingress.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sphericon.fullname" . }}-metrics
  labels:
    {{- include "sphericon.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics
spec:
  type: ClusterIP
  selector:
    {{- include "sphericon.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
{{- end }}
